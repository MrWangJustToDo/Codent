packages:
  - "packages/*"
allowBuilds:
  esbuild: false
  isolated-vm: true
  sharp: true
  spawn-sync: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  # The release package itself. pnpm's supply-chain policy quarantines any
  # version younger than the default window, which rejects the freshly published
  # `codent` tarball a smoke test installs seconds later.
  - codent
  - "@my-react/react-dom@0.3.30"
  - "@my-react/react-jsx@0.3.30"
  - "@my-react/react-refresh@0.3.30"
  - "@my-react/react-terminal@0.0.30"
  - "@my-react/react-vite@0.0.36"
  - "@my-react/react@0.3.30"
  - ink-stream-markdown@0.0.16
  - "@git-diff-view/core@0.1.8"
  - "@git-diff-view/file@0.1.8"
  - "@git-diff-view/lowlight@0.1.8"
  - "@git-diff-view/cli@0.1.11"
  # Only the @tanstack versions the lockfile currently resolves AND that are still
  # younger than the quarantine window need an entry. A version the lockfile no longer
  # resolves, or one that has aged past the window, is dead weight. Add a new entry only
  # when an install reports a fresh version as quarantined.
  - "@tanstack/ai@0.70.0"
  - "@tanstack/openai-base@0.15.0"
  - "@tanstack/ai-mcp@0.9.1"
  - "@tanstack/ai-anthropic@0.22.1"
  - "@tanstack/ai-code-mode@0.5.4"
  - "@agentclientprotocol/sdk@1.8.0"

publicHoistPattern:
  - "*eslint-*"
  - "*@heroui/*"
  - "*@my-react/*"
  - "*@codent/*"

# Force isolated-vm to a Node 26 (abi 147) compatible build.
# ai-isolate-node declares ^6.0.2, whose prebuilds stop at abi 137 (Node 24) and
# whose source build fails on Node 26's changed V8 API; 7.x ships abi147 glibc
# prebuilds (incl. linux-arm64) so the native addon loads without compiling.
overrides:
  isolated-vm: 7.0.1
  # Pin @tanstack/ai to a single instance across the chain: ai-mcp declares a
  # `@tanstack/ai` dependency range of its own and would otherwise pull a second
  # copy beside the one the workspace resolves from the package.json ranges.
  "@tanstack/ai": 0.70.0
