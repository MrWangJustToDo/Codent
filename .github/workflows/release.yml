name: Release to npm

# Publishes ONE package: the fully bundled `codent` CLI.
#
# This is deliberate. `codent` inlines `@codent/app` / `core` / `node` into its
# `dist` (asserted by `validate:self-contained`), so a release needs no other
# package on the registry — not the `@codent/*` libraries, and not the sibling
# hosts (cli / server / extension / playground / mcp-server).
# `pnpm run publish:packages` still exists for the monorepo libraries if they
# ever need releasing independently; it is not part of this workflow.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  # `id-token: write` is what makes trusted publishing work: the npm CLI detects the OIDC
  # environment, exchanges the workflow's identity token for a short-lived publish token, and
  # generates a provenance attestation automatically. There is no `NPM_TOKEN` secret, and
  # there is deliberately nothing to rotate — a long-lived write token is exactly the credential
  # this replaces.
  #
  # SETUP ONCE, OUTSIDE THIS REPO: npm cannot configure a trusted publisher from CI, so the
  # package's page on npmjs.com must list it (Settings → Trusted publishing → GitHub Actions):
  #
  #   Organization or user   MrWangJustToDo
  #   Repository             MyAgent
  #   Workflow filename      release.yml
  #
  # All three are matched exactly and case-sensitively against the *running* workflow. Get one
  # wrong and the publish fails with ENEEDAUTH — npm does not validate the fields when they are
  # saved, so a typo surfaces only at release time. `packages/codent/package.json`'s
  # `repository.url` must also keep matching this GitHub repository, which is a second way to
  # reach the same error.
  #
  # This requires npm CLI >= 11.5.1 and Node >= 22.14.0; the job pins Node 26.4.0, whose bundled
  # npm is newer. pnpm also has to be >= 11.1.3 — `pnpm publish` treated the
  # `${NODE_AUTH_TOKEN}` placeholder `setup-node` writes into `.npmrc` as a literal token, which
  # made an OIDC publish fail with a 404 (pnpm#11513, fixed by pnpm#11526). The job pins 11.9.0.
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.4.0
          registry-url: https://registry.npmjs.org
          cache: pnpm
          # Prevent setup-node from writing an `.npmrc` auth line that references a secret this
          # workflow no longer has. Its default is now "always" for any non-empty value when
          # `registry-url` is set; "never" is the correct setting for OIDC, where authentication
          # comes from the workflow's identity rather than a stored value. The registry itself is
          # still configured by `registry-url`.
          always-auth: false

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: /home/runner/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Generate WXT types (extension .wxt)
        # --ignore-scripts skips the extension postinstall ("wxt prepare"), so
        # ./.wxt/tsconfig.json is never generated. Required for the extension
        # typecheck (tsconfig extends ./.wxt/tsconfig.json) and for the
        # playground build (vite 8 oxc tsconfig auto-discovery loads the root
        # tsconfig's references, including packages/extension).
        run: pnpm --filter @codent/extension exec wxt prepare

      - name: Build
        # Must precede Lint and Typecheck — see the same note in ci.yml: the
        # validate/test scripts import their package's `dist`, and workspace
        # packages resolve through `exports` → `dist`.
        #
        # The full build (not just core → app → node → codent) is intentional:
        # CI only runs on branch pushes, so a `v*` tag reaches this workflow
        # with no prior gate. Everything this repo can build has to build here.
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # @codent/app is the only package with a node:test suite; it imports
        # its own dist entry, so it must run after Build.
        run: pnpm --filter @codent/app test

      - name: Run all validators
        # Mirrors CI: every `validate-*.mjs` (including the ACP host and the
        # command-catalog parity check) must pass before a tag publishes, so a
        # release cannot ship a commit that never went through main CI.
        run: pnpm run validate:all

      - name: Verify the bundle is self-contained
        # The release contract, checked against the *packed* output rather than
        # assumed: no `@codent/*` specifier may survive into `dist`, and the
        # only runtime dependencies may be the four externals that cannot be
        # inlined. A failure here means the tarball would not run for a user
        # who installs nothing else — refuse to publish.
        run: pnpm --filter codent-cli validate:self-contained

      - name: Verify no bundle references an undeclared specifier
        # The companion check: a lazy `import()` of a package that is neither
        # inlined nor declared resolves here (devDependencies are installed) and
        # fails for a consumer. A tag is immutable, so this has to fail before
        # the publish step rather than after it.
        run: pnpm --filter codent-cli validate:runtime-specifiers

      - name: Publish to npm
        # `codent-cli` is the only published package (see the header note). It has
        # no `@codent/*` runtime dependency, so there is no ordering to respect
        # and nothing else to publish first.
        #
        # The dist-tag is derived from the version by the script, not passed
        # here: `0.0.1-beta.1` must land on `beta`, and a stray `--tag latest`
        # would promote a prerelease to the default install for every user.
        #
        # No `env:` and no token. The npm CLI picks OIDC up from the environment, so an empty
        # `NODE_AUTH_TOKEN` would be strictly worse than none: `setup-node`'s
        # `registry-url` writes an `.npmrc` containing `${NODE_AUTH_TOKEN}`, and pnpm before
        # 11.1.3 read that placeholder as a literal token rather than falling through to OIDC
        # (pnpm#11526). Passing the secret here is removed for the same reason it is no longer
        # needed — authentication is not a value this job holds.
        run: pnpm --filter codent-cli run publish:beta
