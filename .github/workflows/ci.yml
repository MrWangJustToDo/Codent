name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.4.0
          cache: pnpm

      # Keep the pnpm content-addressable store between runs. Every job in every
      # workflow installs the same ~540-package tree, and a cold store makes the
      # install (documented at 121-141s) dominate the build. `pnpm store path`
      # is constant on a given OS, so the key is too.
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Linux' && '/home/runner/.local/share/pnpm/store' || runner.os == 'Windows' && '~/AppData/Local/pnpm/store' || '~/Library/pnpm/store' }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Generate WXT types (extension .wxt)
        # --ignore-scripts skips the extension postinstall ("wxt prepare"), so
        # ./.wxt/tsconfig.json is never generated. Required for the extension
        # typecheck (tsconfig extends ./.wxt/tsconfig.json) and for the
        # playground build (vite 8 oxc tsconfig auto-discovery loads the root
        # tsconfig's references, including packages/extension).
        run: pnpm --filter @codent/extension exec wxt prepare

      - name: Build
        # Must precede Lint and Typecheck: the 266 validate/test/smoke scripts
        # import their own package's `dist` (e.g. `../dist/dev.mjs`), and
        # cross-package imports resolve through the `exports` map, which points
        # at `dist`. On a dist-less checkout `import/no-unresolved` and `tsc`
        # report ~280 phantom errors for imports that are correct by
        # construction — the scripts' own `build &&` prefix is what satisfies
        # them locally. See the "Build state is a lint/typecheck prerequisite"
        # note in eslint.config.cjs.
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # @codent/app is the only package with a node:test suite; it imports
        # its own dist entry, so it must run after the build above.
        run: pnpm --filter @codent/app test

      - name: Run all validators
        # Every `validate-*.mjs` in the repo, discovered by glob rather than listed:
        # a new validator is covered by existing, and one with no `validate:*` npm
        # entry still runs (`validate-format-read-file-result` had neither an entry
        # nor a caller, and had gone unrun while reading as coverage in review).
        #
        # This drives the files directly instead of `pnpm run validate:*`, because 151
        # of the 156 core definitions embed `pnpm run build &&` — going through npm
        # would pay a 3.2s rebuild per validator (~483s) against the 34s the whole
        # core suite costs when it reuses the build above.
        #
        # Replaces the dedicated `validate:builtin-skills` step that used to sit
        # here: the suite includes it and reports it by name.
        run: pnpm run validate:all

      - name: Prove the websearch assertions fail on their defects
        # A green validator proves nothing on its own — it only proves the assertions run. The
        # negative-patch harness mutates one defect at a time (keyed selection, the MCP isError
        # check, the remote toolConfig forward, …), rebuilds, and requires the validator to fail
        # on the *matching* assertion. A `.sh` script no workflow invoked was exactly how a
        # previous validator (`validate:render-smoke`) rotted into a false negative; this step is
        # what keeps the proof honest. Linux-only: it shells out to `python3` for the mutations.
        run: bash packages/core/scripts/negative-patch-websearch.sh

      - name: Workspace panel refresh check
        # The suite above deliberately SKIPS this one: its subject is the panel's real 10s refresh
        # timer, so it costs ~40s of genuine waiting and is the only check that renders the TUI.
        # The gate is opt-in for exactly that reason, and this step is what closes the loop — a
        # skipped check that nothing ever enables is a check that rots. Runs after the build above,
        # which the suite and this both rely on.
        env:
          WATCH_WORKSPACE_REFRESH: "1"
        run: pnpm --filter @codent/app run validate:workspace-refresh

      - name: Build the release configuration of @codent/app
        # `Build` above runs the DEFAULT app config, which keeps dependencies
        # external. The release config (`tsdown.config.release.ts`) is a second,
        # separate code path that only the release/publish scripts use — so
        # without this step a broken release config is first discovered at tag
        # time, after the tag is pushed, and the tagged commit is already
        # immutable. Building it here is cheap (it shares `tsdown.shared.ts`
        # with the default config, so the entry list cannot drift), and it
        # leaves `packages/app/dist` in the inlined state that the
        # self-containment check below must see.
        run: pnpm run build:app:release

      - name: Verify the bundled release CLI is self-contained
        # guards the release contract on every PR, not just at tag time: the
        # built `codent` tarball must contain no `@codent/*` specifier and must
        # declare only the four externals that cannot be inlined. Without this,
        # a new `@codent/*` import inside app/core/node would only be caught by
        # the release workflow, after the tag is already pushed.
        #
        # The script builds `codent` itself (`validate:self-contained` is
        # `pnpm run build && node ./scripts/...`), so do NOT wrap it in
        # `pnpm build:codent` — that would rebuild the release app config a
        # second time on top of the step above.
        run: pnpm --filter codent-cli validate:self-contained

      - name: Verify no bundle references an undeclared specifier
        # The other half of the contract, and the half `validate:self-contained`
        # cannot see: a lazy `import()` of a package that is neither inlined nor
        # in `dependencies`. That resolves inside this monorepo — devDependencies
        # are installed here — and throws ERR_MODULE_NOT_FOUND for a consumer, on
        # whichever code path reaches it.
        #
        # Deliberately after the self-containment step: that one rebuilds
        # `dist`, so scanning earlier would scan a stale bundle.
        run: pnpm --filter codent-cli validate:runtime-specifiers

  # The same validator suite on Windows.
  #
  # A separate job rather than a matrix over `check`: the question here is whether the
  # *validators* hold up on Windows, and re-running lint/typecheck there would double the
  # cost while answering a different question with its own failure modes. `check` covers
  # Linux; together the two give per-platform coverage without duplicating either.
  #
  # Windows is the only mechanism that catches a POSIX-only validator, and there are
  # several: `pgrep` does not exist, so the LSP reaping assertions that counted children
  # with it used to pass vacuously ("no processes" == "cannot count"); `sh -c command -v`
  # could never find the language server, so that check always skipped silently; and any
  # validator building paths with a hardcoded "/" would read the wrong place. Those now
  # report themselves as skips rather than as passes, so a green run here means the
  # assertions that *can* run on Windows did run.
  validators-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.4.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Generate WXT types (extension .wxt)
        run: pnpm --filter @codent/extension exec wxt prepare

      - name: Build
        run: pnpm build

      - name: Run all validators
        # `--quiet` keeps the log to the per-package summaries and any failure: on
        # Windows many validators legitimately skip (no language server, no
        # `pgrep`), and the individual `ok` lines would bury the skips.
        run: node scripts/run-all-validators.mjs --quiet
